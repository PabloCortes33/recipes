<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 2em;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 0.5em;
            border-bottom: 3px solid #007BFF;
            padding-bottom: 0.5em;
        }
        
        .auth-section, .main-section {
            margin-top: 2em;
        }
        
        .hidden { display: none; }
        
        label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: 600;
            color: #555;
        }
        
        input[type="password"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.8em;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1em;
            font-family: inherit;
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #007BFF;
        }
        
        .btn {
            padding: 0.8em 1.5em;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            margin-right: 0.5em;
            margin-top: 1em;
        }
        
        .btn-primary {
            background: #007BFF;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0056b3;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #545b62;
        }
        
        .status {
            padding: 1em;
            margin-top: 1em;
            border-radius: 4px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .recipe-preview {
            background: #f8f9fa;
            padding: 1.5em;
            margin-top: 1.5em;
            border-radius: 4px;
            border: 2px solid #e0e0e0;
        }
        
        .recipe-preview h3 {
            color: #007BFF;
            margin-bottom: 1em;
        }
        
        .recipe-preview pre {
            background: white;
            padding: 1em;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        
        .loading {
            text-align: center;
            padding: 2em;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007BFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .git-status {
            background: #f8f9fa;
            padding: 1em;
            border-radius: 4px;
            margin-top: 1em;
        }
        
        .form-group {
            margin-bottom: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1em; flex-wrap: wrap; gap: 1em;">
            <h1 style="margin: 0;">🍳 AI Recipe Generator</h1>
            <a href="/jobs.html" class="btn btn-secondary">📝 View Jobs</a>
        </div>
        
        <!-- Authentication Section -->
        <div id="auth-section" class="auth-section hidden">
            <div class="form-group">
                <label for="auth-password">Enter Password:</label>
                <input type="password" id="auth-password" placeholder="Your server password">
            </div>
            <button class="btn btn-primary" onclick="authenticate()">Login</button>
            <div id="auth-status"></div>
        </div>
        
        <!-- Main Application -->
        <div id="main-section" class="main-section">
            
            <!-- Mode Toggle -->
            <div class="form-group" style="margin-bottom: 1.5em;">
                <label style="margin-bottom: 0.5em;">Mode:</label>
                <div style="display: flex; gap: 1em; align-items: center;">
                    <label style="display: flex; align-items: center; cursor: pointer; font-weight: normal;">
                        <input type="radio" name="mode" value="create" checked onchange="updateMode()" style="margin-right: 0.5em; width: auto;">
                        <span>✨ Create Recipe</span>
                    </label>
                    <label style="display: flex; align-items: center; cursor: pointer; font-weight: normal;">
                        <input type="radio" name="mode" value="store" onchange="updateMode()" style="margin-right: 0.5em; width: auto;">
                        <span>📝 Store Recipe</span>
                    </label>
                </div>
            </div>
            
            <!-- Recipe Generation Form -->
            <div class="form-group">
                <label id="prompt-label" for="recipe-prompt">What recipe would you like to create?</label>
                <textarea id="recipe-prompt" placeholder="Example: roasted capsicum dip with peanuts"></textarea>
                <small id="prompt-help" style="color: #666;">🔷 Automatically researches with Gemini, then 🤖 generates recipe with Claude CLI</small>
            </div>
            
            <button class="btn btn-primary" onclick="generateRecipe()" id="generate-btn">
                🤖 Generate Recipe
            </button>
            
            <div id="generation-status"></div>
            
            <!-- Recipe Preview -->
            <div id="recipe-preview" class="hidden"></div>
            
            <!-- Git Operations -->
            <div class="git-status hidden" id="git-controls">
                <h3>Git Operations</h3>
                <button class="btn btn-secondary" onclick="gitPull()">⬇️ Pull from GitHub</button>
                <button class="btn btn-success" onclick="gitPush()">⬆️ Push to GitHub</button>
                <button class="btn btn-secondary" onclick="gitStatus()">📊 Show Status</button>
                <div id="git-status"></div>
            </div>
        </div>
    </div>
    
    <script>
        let authToken = 'no-auth-needed'; // Default token (bypasses auth)
        let currentRecipes = null;
        let currentMode = 'create'; // 'create' or 'store'
        
        function updateMode() {
            const modeRadios = document.querySelectorAll('input[name="mode"]');
            currentMode = Array.from(modeRadios).find(r => r.checked)?.value || 'create';
            
            const promptLabel = document.getElementById('prompt-label');
            const promptInput = document.getElementById('recipe-prompt');
            const promptHelp = document.getElementById('prompt-help');
            const generateBtn = document.getElementById('generate-btn');
            
            if (currentMode === 'create') {
                promptLabel.textContent = 'What recipe would you like to create?';
                promptInput.placeholder = 'Example: roasted capsicum dip with peanuts';
                promptHelp.textContent = '🔷 Automatically researches with Gemini, then 🤖 generates recipe with Claude CLI';
                generateBtn.textContent = '🤖 Generate Recipe';
            } else {
                promptLabel.textContent = 'Paste the recipe you want to store:';
                promptInput.placeholder = 'Paste your recipe here (from Instagram, website, etc.)...';
                promptHelp.textContent = '🤖 Claude CLI will organize and format it to match your recipe collection structure';
                generateBtn.textContent = '📝 Format & Store Recipe';
            }
        }
        
        async function authenticate() {
            const password = document.getElementById('auth-password').value;
            authToken = password;
            
            try {
                const response = await fetch('/api/health', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (response.ok) {
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('main-section').classList.remove('hidden');
                    showStatus('auth-status', 'Authenticated successfully!', 'success');
                } else {
                    showStatus('auth-status', 'Invalid password', 'error');
                }
            } catch (error) {
                showStatus('auth-status', 'Connection error: ' + error.message, 'error');
            }
        }
        
        let pollInterval = null;
        
        async function generateRecipe() {
            const prompt = document.getElementById('recipe-prompt').value.trim();
            
            if (!prompt) {
                const errorMsg = currentMode === 'create' 
                    ? 'Please enter what recipe you want to create' 
                    : 'Please paste the recipe you want to store';
                showStatus('generation-status', errorMsg, 'error');
                return;
            }
            
            const statusMsg = currentMode === 'create' 
                ? 'Starting recipe generation...' 
                : 'Starting recipe formatting...';
            showStatus('generation-status', statusMsg, 'info');
            document.getElementById('generate-btn').disabled = true;
            document.getElementById('recipe-preview').innerHTML = '<div class="loading"><div class="spinner"></div><p>Starting job...</p></div>';
            document.getElementById('recipe-preview').classList.remove('hidden');
            
            try {
                // Start job with mode
                const response = await fetch('/api/generate-recipe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt, mode: currentMode })
                });
                
                const data = await response.json();
                
                if (data.success && data.jobId) {
                    // Save jobId to localStorage (for recovery)
                    localStorage.setItem('currentJobId', data.jobId);
                    
                    // Start polling for status
                    pollJobStatus(data.jobId);
                } else {
                    showStatus('generation-status', 'Failed to start job', 'error');
                    document.getElementById('recipe-preview').classList.add('hidden');
                    document.getElementById('generate-btn').disabled = false;
                }
            } catch (error) {
                showStatus('generation-status', 'Error: ' + error.message, 'error');
                document.getElementById('recipe-preview').classList.add('hidden');
                document.getElementById('generate-btn').disabled = false;
            }
        }
        
        async function pollJobStatus(jobId) {
            // Clear any existing poll
            if (pollInterval) {
                clearInterval(pollInterval);
            }
            
            // Poll every 2 seconds
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/job/${jobId}`);
                    const job = await response.json();
                    
                    if (job.status === 'pending' || job.status === 'researching' || job.status === 'generating' || job.status === 'formatting' || job.status === 'refining') {
                        // Still in progress
                        const messages = {
                            'pending': 'Starting...',
                            'researching': '🔷 Researching with Gemini...',
                            'generating': '🤖 Generating recipe with Claude CLI...',
                            'formatting': '🤖 Formatting recipe with Claude CLI...',
                            'refining': '✨ Refining recipe with Claude CLI...'
                        };
                        showStatus('generation-status', job.progress || messages[job.status], 'info');
                        document.getElementById('recipe-preview').innerHTML = `<div class="loading"><div class="spinner"></div><p>${job.progress || messages[job.status]}</p></div>`;
                    } else if (job.status === 'completed') {
                        // Job complete!
                        clearInterval(pollInterval);
                        pollInterval = null;
                        localStorage.removeItem('currentJobId');
                        
                        currentRecipes = job.recipes;
                        displayRecipePreview(job.recipes, job.researchContext, job.mode, job.jobId);
                        
                        const successMsg = job.mode === 'create'
                            ? 'Recipe generated successfully! 🔷 Gemini research → 🤖 Claude CLI generation'
                            : 'Recipe formatted successfully! 🤖 Claude CLI formatting';
                        showStatus('generation-status', successMsg + ' <a href="/jobs.html" style="margin-left: 1em;">View in Jobs Dashboard</a>', 'success');
                        document.getElementById('git-controls').classList.remove('hidden');
                        document.getElementById('generate-btn').disabled = false;
                    } else if (job.status === 'failed') {
                        // Job failed
                        clearInterval(pollInterval);
                        pollInterval = null;
                        localStorage.removeItem('currentJobId');
                        
                        showStatus('generation-status', `❌ Failed: ${job.error}. <a href="/jobs.html">View in Jobs Dashboard</a>`, 'error');
                        document.getElementById('recipe-preview').classList.add('hidden');
                        document.getElementById('generate-btn').disabled = false;
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 2000);
        }
        
        // Check for in-progress job on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedJobId = localStorage.getItem('currentJobId');
            if (savedJobId) {
                const resume = confirm('You have an in-progress job. Resume watching it?');
                if (resume) {
                    showStatus('generation-status', 'Resuming job...', 'info');
                    document.getElementById('recipe-preview').innerHTML = '<div class="loading"><div class="spinner"></div><p>Checking job status...</p></div>';
                    document.getElementById('recipe-preview').classList.remove('hidden');
                    pollJobStatus(savedJobId);
                } else {
                    localStorage.removeItem('currentJobId');
                }
            }
        });
        
        let currentJobId = null; // Track current job for refinement
        
        function displayRecipePreview(recipes, usedResearch, mode, jobId = null) {
            const preview = document.getElementById('recipe-preview');
            const subtitle = mode === 'create'
                ? '🔷 Gemini Research → 🤖 Claude CLI Generation'
                : '🤖 Claude CLI Formatting';
            
            currentJobId = jobId; // Store jobId for refinement
            
            const refineButton = mode === 'create' 
                ? `<button class="btn btn-primary" onclick="refineRecipe()" style="margin-right: 0.5em;">✨ Refine Recipe</button>`
                : '';
            
            preview.innerHTML = `
                <h3>${mode === 'create' ? 'Generated' : 'Formatted'} Recipes</h3>
                <p style="color: #666; font-size: 0.9em; margin-top: -0.5em;">${subtitle}</p>
                <div style="margin-bottom: 2em;">
                    <h4>🇬🇧 English: ${recipes.english.filename}</h4>
                    <pre>${recipes.english.content}</pre>
                </div>
                <div>
                    <h4>🇪🇸 Spanish: ${recipes.spanish.filename}</h4>
                    <pre>${recipes.spanish.content}</pre>
                </div>
                <div style="margin-top: 1em;">
                    ${refineButton}
                    <button class="btn btn-success" onclick="saveRecipe()">💾 Save & Commit</button>
                </div>
            `;
        }
        
        async function refineRecipe() {
            if (!currentJobId) {
                alert('No job ID available for refinement');
                return;
            }
            
            const refinementPrompt = prompt('What would you like to change or improve in this recipe?\n\nExamples:\n- "Make it spicier"\n- "Add more vegetables"\n- "Reduce cooking time"\n- "Make it healthier"');
            
            if (!refinementPrompt || !refinementPrompt.trim()) {
                return;
            }
            
            showStatus('generation-status', 'Refining recipe...', 'info');
            document.getElementById('recipe-preview').innerHTML = '<div class="loading"><div class="spinner"></div><p>Refining recipe with Claude CLI...</p></div>';
            document.getElementById('generate-btn').disabled = true;
            
            try {
                const response = await fetch(`/api/job/${currentJobId}/refine`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ refinementPrompt: refinementPrompt.trim() })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Poll the original job (it will be updated with refined recipe)
                    const jobIdToPoll = data.originalJobId || currentJobId || data.jobId;
                    localStorage.setItem('currentJobId', jobIdToPoll);
                    pollJobStatus(jobIdToPoll);
                } else {
                    showStatus('generation-status', 'Failed to refine recipe: ' + (data.error || 'Unknown error'), 'error');
                    document.getElementById('generate-btn').disabled = false;
                }
            } catch (error) {
                showStatus('generation-status', 'Error refining recipe: ' + error.message, 'error');
                document.getElementById('generate-btn').disabled = false;
            }
        }
        
        async function saveRecipe() {
            if (!currentRecipes) return;
            
            const commitMessage = prompt('Commit message:', `Add recipe: ${currentRecipes.english.filename}`);
            if (!commitMessage) return;
            
            showStatus('generation-status', 'Saving and committing...', 'info');
            
            try {
                const response = await fetch('/api/save-recipe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ recipes: currentRecipes, commitMessage })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('generation-status', 'Recipe saved and committed! Ready to push.', 'success');
                } else {
                    showStatus('generation-status', 'Failed to save recipe', 'error');
                }
            } catch (error) {
                showStatus('generation-status', 'Error: ' + error.message, 'error');
            }
        }
        
        async function gitPush() {
            showStatus('git-status', 'Pushing to GitHub...', 'info');
            
            try {
                const response = await fetch('/api/git/push', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                showStatus('git-status', data.success ? 'Pushed successfully!' : 'Push failed', data.success ? 'success' : 'error');
            } catch (error) {
                showStatus('git-status', 'Error: ' + error.message, 'error');
            }
        }
        
        async function gitPull() {
            showStatus('git-status', 'Pulling from GitHub...', 'info');
            
            try {
                const response = await fetch('/api/git/pull', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                showStatus('git-status', data.success ? 'Pulled successfully!' : 'Pull failed', data.success ? 'success' : 'error');
            } catch (error) {
                showStatus('git-status', 'Error: ' + error.message, 'error');
            }
        }
        
        async function gitStatus() {
            try {
                const response = await fetch('/api/git/status', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                if (data.success) {
                    const status = data.status;
                    const message = `
                        Modified: ${status.modified.length}
                        Created: ${status.created.length}
                        Deleted: ${status.deleted.length}
                        Ahead: ${status.ahead}, Behind: ${status.behind}
                    `;
                    showStatus('git-status', message, 'info');
                }
            } catch (error) {
                showStatus('git-status', 'Error: ' + error.message, 'error');
            }
        }
        
        function showStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
    </script>
</body>
</html>
